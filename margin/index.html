<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPAN margin calculator: preview</title>
<style>
html,body{margin:0;background:#000;color:#F2EFE6;font-family:system-ui,-apple-system,"Segoe UI",Inter,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;display:flex;justify-content:center;align-items:flex-start}
#wrap{display:none;width:100%;max-width:1040px;padding:10px;box-sizing:border-box}
#fr{background:#050505;border-radius:10px;padding:12px 14px;outline:1px solid transparent;transition:outline-color .3s}
#fr.wi{outline:1px dashed #9C8CFF;outline-offset:-4px}
.lb{font-size:11px;letter-spacing:.12em;color:#8C8578}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
#st{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#rc{font-family:ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:0;white-space:nowrap}
@media (max-width:480px){#rc{display:none}}
.num{display:flex;align-items:baseline;gap:10px;margin-top:6px;position:relative}
#mg{font-size:clamp(34px,6vw,52px);font-weight:400;font-variant-numeric:tabular-nums;letter-spacing:-0.5px}
#dl{font-size:12px;color:#FFA028;opacity:0;transition:opacity .4s;min-width:40px}
.bar{height:3px;background:#1A140B;margin:6px 0 5px}
#bar{height:3px;width:30%;background:#FFA028;transition:width .3s}
#bf{font-size:12px;color:#8C8578;font-variant-numeric:tabular-nums}
#why{font-size:15px;line-height:1.45;margin-top:8px;min-height:44px;color:#F2EFE6}
.ctl{display:flex;gap:6px;margin-top:6px;align-items:center}
.ch{font:inherit;font-size:11px;letter-spacing:.08em;padding:6px 12px;border:1px solid #6B5530;color:#C9B48A;background:transparent;border-radius:3px;min-height:44px;min-width:44px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.ch.on{border-color:#FFA028;color:#FFA028}
.ch:focus-visible{outline:2px solid #FFA028;outline-offset:2px}
#dots{text-align:center;margin-top:6px;line-height:3px}
#cap{font-size:12px;color:#A39B8D;min-height:54px;line-height:1.5;margin-top:6px}
#cv{width:100%;height:clamp(230px,44vh,440px);display:block;touch-action:manipulation;margin-top:4px}
#th{margin-top:6px}
#hr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:#1A140B;margin-top:4px;font-variant-numeric:tabular-nums}
#hr>div{background:#050505;padding:7px 8px;min-width:0}
#hr .v{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hr .s{font-size:11px;color:#8C8578;margin-top:2px}
#hint{font-size:11px;color:#8C8578;margin-top:8px;line-height:1.5}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:440px){#cv{height:clamp(220px,38vh,400px)}#why{min-height:66px}#cap{min-height:90px}.num .lb{font-size:10px;letter-spacing:.08em}}
@media (max-width:360px){#why{min-height:88px}#cap{min-height:108px}}
@media (max-height:620px){#cv{height:clamp(200px,34vh,360px)}}
</style>
</head>

{h:()=>'§2 SPAN: margin = the largest scenario loss. Here S1 price down, '+fmt(marg(bk))+'.',c:'Risk = max(scan risk + intra-commodity spread charge + delivery charge − inter-commodity credit, short option minimum). No spreads or short options here, so risk = scan risk.',s:{hl:0},tiles:['S1 LOSS = LOTS × LOSS PER LOT',()=>{const r=R()[0];return['FUTURES','PUTS','CALLS'].map((n,i)=>[n,sgn(r[i]*bk[i]),Math.round(bk[i])+' × '+sgn(r[i])]);}]},
{h:()=>'§3 What-if: buying 10 futures would raise margin to $16,000. Not applied.',c:'Nothing changes until you apply. The dashed line is the proposed trade.',s:{wi:1},tiles:['BEFORE → AFTER (NOT APPLIED)',()=>[['MARGIN','$16,000','from $6,000'],['EXCESS','$4,000','from $14,000'],['FUTURES','20','from 10']]]},
{h:()=>'§4 Risk contribution: futures add margin; puts offset it.',c:'Each position’s share = lots × its loss in the scenario that sets margin. Shares add to the total because one scenario sets it and no floor applies.',s:{hl:0},tiles:['SHARE OF MARGIN (FROM S1)',()=>{const r=R()[0];return['FUTURES','PUTS','CALLS'].map((n,i)=>[n,sgn(r[i]*bk[i]),i===1?'hedge':'adds margin']);}]},
{h:()=>'§5 SPAN file v4: price scan range +8%. Margin $6,000 → '+fmt(marg(bk))+'.',c:'Both price scenarios widen; S1 still sets margin. v3 is kept so any day can be recomputed. Scaling is illustrative.',s:{pf:1.08,ping:1},tiles:['SPAN FILE V3 → V4',()=>[['MARGIN',fmt(marg(bk)),'from $6,000'],['PRICE RANGE','+8%','up and down'],['RECEIPT','b91e…04d','from 7f3a…c21']]]},
{h:()=>'§6 Data quality: 3 inputs rejected with codes. The engine never guesses.',c:'Rejected rows are left out of the margin and listed for correction.',s:{pf:1.08,dim:1},tiles:['REJECTED INPUTS',()=>[['ROW 7 \u00b7 E101','Unknown','contract FEF7'],['ROW 12 \u00b7 E204','Duplicate','trade T-1182'],['REC 84 \u00b7 E301','Malformed','SPAN file rejected']]]},
{h:()=>'§7 SPAN 2 readiness: same book, toy VaR '+fmt(var99(bk))+' vs SPAN '+fmt(marg(bk))+'.',c:'Margin models plug in behind one interface. White line: toy 1-day 99% historical VaR on synthetic history, not SPAN 2.',s:{pf:1.08,v:1},tiles:['SAME BOOK, TWO MODELS',()=>[['SPAN',fmt(marg(bk)),'scenario based'],['TOY VAR 99%',fmt(var99(bk)),'historical'],['DIFFERENCE',sgn(var99(bk)-marg(bk)),'model choice']]]}];
let step=0;
const IDLE=COARSE?'Tap the map to read a book; tap again to clear. ‹ › step through the brief.':'Hover the map to read a book. ← → step through the brief; Space or 3D adds calls as a third axis.';
function caption(h){$('cap').innerHTML=h;}
function apply(i){step=Math.max(0,Math.min(STEPS.length-1,i));const st=STEPS[step],s=st.s;$('sn').textContent='BRIEF '+(step+1)+'/'+STEPS.length;
$('dots').innerHTML=STEPS.map((_,k)=>'<span style="display:inline-block;width:'+(k===step?14:5)+'px;height:3px;margin:0 2px;border-radius:2px;background:'+(k===step?'#FFA028':k<step?'#6B4A16':'#3A2C18')+';transition:width .25s"></span>').join('');
pft=s.pf||1;hl=s.hl===undefined?-1:s.hl;varOn=!!s.v;dimT=s.dim?1:0;focus=-1;probe=null;armed=null;
const fr=$('fr');if(s.wi){bkt=[20,10,10];route=[[10,10,10],[20,10,10]];fr.classList.add('wi');$('st').innerHTML='<span style="color:#9C8CFF;">NOT APPLIED</span> · SGX IRON ORE · SYNTHETIC';}else{bkt=[10,10,10];route=null;fr.classList.remove('wi');$('st').textContent='SGX IRON ORE · SPAN '+(pft>1?'V4':'V3')+' · SYNTHETIC';}
$('rc').textContent=pft>1?'receipt b91e…04d':'receipt 7f3a…c21';const dl=$('dl');if(s.ping){ping=0;dl.textContent='+$480';dl.style.opacity=1;}else{dl.style.opacity=0;}
stepCap='<span style="color:#A39B8D;">'+st.c+'</span>';caption(stepCap);kick();}
function setChips(){$('b2').classList.toggle('on',dt===0);$('b3').classList.toggle('on',dt===1);$('b2').setAttribute('aria-pressed',dt===0);$('b3').setAttribute('aria-pressed',dt===1);}
function setDim(x){dt=x;focus=-1;probe=null;armed=null;setChips();caption(stepCap);kick();}
$('b2').onclick=()=>setDim(0);$('b3').onclick=()=>setDim(1);
$('nx').onclick=()=>apply(step+1);$('pv').onclick=()=>apply(step-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'){apply(step+1);e.preventDefault();}else if(e.key==='ArrowLeft'||e.key==='PageUp'){apply(step-1);e.preventDefault();}else if(e.key===' '&&!(e.target instanceof HTMLButtonElement)){setDim(dt?0:1);e.preventDefault();}else if(e.key==='Escape'){focus=-1;probe=null;armed=null;caption(stepCap);kick();}});
function pickFace(px,py){let hit=null;for(let k=faces.length-1;k>=0;k--){const o=faces[k];if(!o.front||o.f.p.i<0)continue;const pts=o.pts;let ins=false;for(let a=0,b=pts.length-1;a<pts.length;b=a++)if(((pts[a][1]>py)!=(pts[b][1]>py))&&(px<(pts[b][0]-pts[a][0])*(py-pts[a][1])/(pts[b][1]-pts[a][1])+pts[a][0]))ins=!ins;if(ins){hit=o;break;}}
if(!hit){let bd=28;faces.forEach(o=>{if(!o.front||o.f.p.i<0)return;const dd=Math.hypot(o.c[0]-px,o.c[1]-py);if(dd<bd){bd=dd;hit=o;}});}return hit;}
function read(px,py){if(d>0.5){const o=pickFace(px,py);if(!o)return null;const k=o.f.p.i,l=dot(R()[k],bk);return{key:'f'+k,face:k,lines:[NM[k]+' face',(l>=0?'Book loses ':'Book gains ')+fmt(Math.abs(l))+' in this scenario','Deficit if this loss exceeds '+fmt(EQ),(COARSE?'Tap again':'Click')+' for the per-lot breakdown']};}
const q=inv2(px,py);if(px<PADL-6||px>W-PADR+6||py<PADT-6||py>H-PADB+6)return null;const l=losses(q),m=Math.max(0,...l),k=l.indexOf(Math.max(...l)),lim=Math.abs(q[0])<=L&&Math.abs(q[1])<=L,ok=m<=EQ&&lim,pos=Math.round(q[0])+' futures, '+Math.round(q[1])+' puts, '+Math.round(q[2])+' calls';
const lines=ok?['Margin '+fmt(m),pos,'Set by '+NM[k],'Excess '+fmt(EQ-m)]:lim?['Deficit '+fmt(m-EQ),pos,'Margin '+fmt(m)+' > equity '+fmt(EQ)]:['Outside position limit',pos,'Limit ±'+L+' lots per position'];
return{key:(ok?'r':'o')+Math.round(q[0]/4)+'_'+Math.round(q[1]/4),k,ok,q,lines};}
function say(h){$('rd').textContent=h?h.lines.join('. '):'';}
cv.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||focus>=0)return;const r=cv.getBoundingClientRect();lastIn=performance.now();probe=read(e.clientX-r.left,e.clientY-r.top);kick();});
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){probe=null;kick();}});
cv.addEventListener('click',e=>{const r=cv.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top;lastIn=performance.now();
if(focus>=0){focus=-1;probe=null;armed=null;caption(stepCap);kick();return;}
const h=read(px,py);if(!h){probe=null;armed=null;caption(stepCap);kick();return;}
if(h.face!=null){if(COARSE&&armed!==h.key){armed=h.key;probe=h;say(h);kick();return;}focus=h.face;fset=0;armed=null;probe=null;caption('<span style="color:#A39B8D;">'+NM[focus]+': each position’s loss per lot × lots held. '+(COARSE?'Tap':'Click')+' anywhere to go back.</span>');kick();return;}
if(COARSE){if(probe&&armed===h.key){probe=null;armed=null;}else{probe=h;armed=h.key;say(h);}kick();}});
let last=performance.now();
function ease(a,b,k){return Math.abs(b-a)<1e-4?b:a+(b-a)*k;}
function kick(){if(!running){running=true;last=performance.now();requestAnimationFrame(tick);}}
function tick(t){const dts=Math.min(0.05,(t-last)/1000);last=t;let busy=false;
const nd=ease(d,dt,Math.min(1,dts*(RM?60:3.2)));if(Math.abs(nd-dt)<0.002&&nd!==dt){d=dt;busy=true;}else{if(nd!==d)busy=true;d=nd;}
const np=ease(pf,pft,Math.min(1,dts*8));if(np!==pf){pf=np;busy=true;varCache=null;}
const nb=bk.map((x,i)=>ease(x,bkt[i],Math.min(1,dts*5)));if(nb.some((x,i)=>x!==bk[i])){bk=nb;busy=true;}
const ndim=ease(dim,dimT,Math.min(1,dts*6));if(ndim!==dim){dim=ndim;busy=true;}
if(ping<1.6){ping+=dts/0.9;busy=true;}
if(focus>=0&&d>0.5){const u0=R()[focus],n=Math.hypot(...u0),u=u0.map(x=>x/n),ty=Math.atan2(u[0],u[1]),tp=Math.atan2(-Math.hypot(u[0],u[1]),u[2]);let dy=Math.atan2(Math.sin(ty-cam.y),Math.cos(ty-cam.y));if(Math.abs(dy)>1e-3||Math.abs(tp-cam.p)>1e-3)busy=true;cam.y+=dy*Math.min(1,dts*4);cam.p+=(tp-cam.p)*Math.min(1,dts*4);}
else{if(dt===1&&!RM&&t-lastIn>3000&&ping>=1.6&&!probe&&focus<0&&!document.hidden){yaw+=dts*2*Math.PI/90;busy=true;}const wy=yaw*d,wp=pitch*d;let dy=Math.atan2(Math.sin(wy-cam.y),Math.cos(wy-cam.y));if(Math.abs(dy)>1e-4||Math.abs(wp-cam.p)>1e-4)busy=true;cam.y+=dy*Math.min(1,dts*6);cam.p+=(wp-cam.p)*Math.min(1,dts*6);}
if(focus>=0&&fset<1){fset=Math.min(1,fset+dts*1.6);busy=true;}
hud();const w=STEPS[step].h();if($('why').textContent!==w)$('why').textContent=w;draw();
if(busy||t-lastIn<3100&&dt===1)requestAnimationFrame(tick);else running=false;}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)kick();});
$('hint').textContent='Preview: synthetic numbers, 4 scenarios (real SPAN files have 16, including 2 extreme moves). '+IDLE;
addEventListener('resize',rs);rs();apply(0);setChips();

</script>
