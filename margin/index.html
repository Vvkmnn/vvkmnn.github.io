function pickFace(px,py){for(let k=faces.length-1;k>=0;k--){const o=faces[k];if(!o.front)continue;const pts=o.pts;let ins=false;for(let a=0,b=pts.length-1;a<pts.length;b=a++)if(((pts[a][1]>py)!=(pts[b][1]>py))&&(px<(pts[b][0]-pts[a][0])*(py-pts[a][1])/(pts[b][1]-pts[a][1])+pts[a][0]))ins=!ins;if(ins)return o;}return null;}
function pick2(px,py){if(!cells)return null;let best=null,bd=1e9;cells.forEach(c=>{const p=P2([c[0],c[1],bk[2]]),dd=Math.hypot(p[0]-px,p[1]-py);if(dd<bd){bd=dd;best=c;}});return bd<(COARSE?20:12)?best:null;}

else{if(dt2===1&&!RM&&t-lastIn>3000&&ping>=1.6)yaw+=dts*2*Math.PI/90;const wy=yaw*d,wp=pitch*d;let dy=wy-cam.y;dy=Math.atan2(Math.sin(dy),Math.cos(dy));cam.y+=dy*Math.min(1,dts*6);cam.p+=(wp-cam.p)*Math.min(1,dts*6);}
